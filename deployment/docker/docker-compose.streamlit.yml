version: '3.8'

services:
  nifty-pulse-streamlit:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.streamlit
    container_name: nifty-pulse-streamlit-app
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8501
      - AZURE_REGION=centralindia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
